services:

  # =========================
  # PostgreSQL (CDC Source)
  # =========================
  postgres:
    image: postgres:15-alpine
    container_name: bank_postgres
    command:
      - postgres
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - F:/DaTech-kafka/banking-fraud-platform/persisted-volumes/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  # =========================
  # Banking API Backend
  # =========================
  api:
    build:
      context: ./api      # Keeps looking for the Dockerfile in the api folder
      dockerfile: Dockerfile
    container_name: bank_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=postgresql+asyncpg://postgres_admin:SecureBankPassword2026%21@bank_postgres:5432/banking_db
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - ENABLE_DEMO_RESET=true
      - DEMO_ADMIN_KEY=secret-demo-key-99
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
      schema-registry:
        condition: service_healthy
    restart: unless-stopped

  # =========================
  # Kafka (KRaft Mode)
  # =========================
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: bank_kafka
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 90
      start_period: 300s
    restart: unless-stopped

  # =========================
  # Kafka Connect (Debezium)
  # =========================
  connect:
    image: debezium/connect:2.4
    container_name: bank_connect
    depends_on:
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8083' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 300s
    restart: unless-stopped

  # =========================
  # Schema Registry
  # =========================
  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    container_name: bank_schema_registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "18081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 50
      start_period: 60s
    restart: unless-stopped

  # =========================
  # Kafka Connect Bootstrapper
  # =========================
  connect-init:
    image: curlimages/curl:latest
    container_name: bank_connect_init
    depends_on:
      - kafka
      - connect
    volumes:
      - ./debezium-postgres-connector.json:/tmp/debezium-postgres-connector.json:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo 'Waiting for Kafka Connect availability...'
        until curl -fs http://connect:8083/connectors >/dev/null 2>&1; do
          sleep 5
        done

        echo 'Registering Debezium connector if missing...'
        if curl -s -o /dev/null -w '%{http_code}' http://connect:8083/connectors/banking-cdc-connector | grep -q '^200$$'; then
          echo 'Connector already registered.'
          exit 0
        fi

        curl -s -X POST \
          -H 'Content-Type: application/json' \
          --data @/tmp/debezium-postgres-connector.json \
          http://connect:8083/connectors

        echo 'Connector registration complete.'
    restart: "no"

  # =========================
  # Flink JobManager (UI)
  # =========================
  flink-jobmanager:
    image: flink:1.18-scala_2.12-java11
    container_name: bank_flink_jobmanager
    ports:
      - "8082:8081"
      - "9249:9249"
    command: jobmanager
    depends_on:
      opensearch-dashboards:
        condition: service_started
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - FLINK_RISK_GROUP_ID=fraud-engine-v2
      - KAFKA_FRAUD_ALERT_TOPIC=fraud_alerts_v2
      - KAFKA_CRITICAL_ALERT_TOPIC=critical_alerts_v2
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=admin
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 50
      start_period: 60s
    restart: unless-stopped

  # =========================
  # Flink TaskManager (Workers)
  # =========================
  flink-taskmanager:
    image: flink:1.18-scala_2.12-java11
    container_name: bank_flink_taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=admin
    restart: unless-stopped

  # =========================
  # Kafka Topic Bootstrapper
  # =========================
  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: bank_kafka_init
    depends_on:
      - kafka
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo 'Waiting for Kafka broker availability...'
        until kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          sleep 5
        done

        echo 'Provisioning Platform Topics...'

        topics="
        api_requests
        dead_letter_queue
        fraud_alerts
        critical_alerts
        risk_scores
        risk_scores_v2
        fraud_alerts_v2
        critical_alerts_v2
        enriched_transactions
        model_features
        banking.login_events
        banking.sessions
        banking.accounts
        banking.transactions
        banking.beneficiaries
        banking.employee_actions
        banking.unified_timeline
        "

        for topic in $$topics; do
          kafka-topics \
            --bootstrap-server kafka:29092 \
            --create \
            --if-not-exists \
            --topic $$topic \
            --partitions 3 \
            --replication-factor 1
        done

        echo 'Verifying topics...'
        kafka-topics --bootstrap-server kafka:29092 --list

        echo 'Bootstrap complete.'
    restart: "no"

  # =========================================================================
  # Flink Fraud Engine Job Submitter
  # =========================================================================
  fraud-engine:
    build:
      context: ./analytics/flink-risk-engine-java
      dockerfile: Dockerfile
    container_name: bank_fraud_engine
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FLINK_RISK_GROUP_ID: fraud-engine-v2
      KAFKA_FRAUD_ALERT_TOPIC: fraud_alerts_v2
      KAFKA_CRITICAL_ALERT_TOPIC: critical_alerts_v2
      FLINK_JOBMANAGER_HOST: flink-jobmanager
      FLINK_JOBMANAGER_PORT: "8081"
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_USER: admin
      OPENSEARCH_PASSWORD: admin
    restart: "no"

  # =========================================================================
  # Secondary Risk Engine (Python) -- ACTIVE-ACTIVE redundancy for fraud-engine
  # -------------------------------------------------------------------------
  # Runs continuously alongside the Flink engine above (not just when it's
  # down), consuming the same raw topics independently and emitting to the
  # fraud_alerts / critical_alerts topics (provisioned since day one by
  # kafka-init, previously never written to by anything). The Alert
  # Aggregator consumes from both engines' output topics and bundles by
  # identity, so an incident keeps forming from whichever engine is up.
  # See analytics/kafka-stream-scripts/secondary_risk_engine.py.
  # =========================================================================
  fraud-engine-secondary:
    build:
      context: .
      dockerfile: analytics/kafka-stream-scripts/Dockerfile
    container_name: bank_fraud_engine_secondary
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SECONDARY_ENGINE_GROUP_ID: fraud-engine-secondary-v1
      SECONDARY_ENGINE_METRICS_PORT: "9500"
      SECONDARY_FRAUD_TOPIC: fraud_alerts
      SECONDARY_CRITICAL_TOPIC: critical_alerts
      API_REQUEST_SCHEMA_PATH: /app/config/schemas/api_request.avsc
    ports:
      - "9500:9500"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    restart: unless-stopped

  # =========================================================================
  # Fraud Engine Watchdog -- redundancy/liveness observability
  # -------------------------------------------------------------------------
  # Polls both risk-scoring engines and exposes fraud_engine_primary_up /
  # fraud_engine_secondary_up / fraud_engine_redundancy_status to Prometheus.
  # Does not perform failover (both engines already run all the time) --
  # this is purely "can an operator see, at a glance, whether fraud scoring
  # currently has its full redundancy or is running on one engine alone."
  # See analytics/engine-watchdog/watchdog.py.
  # =========================================================================
  fraud-engine-watchdog:
    build:
      context: ./analytics/engine-watchdog
      dockerfile: Dockerfile
    container_name: bank_fraud_engine_watchdog
    depends_on:
      - flink-jobmanager
      - fraud-engine-secondary
    environment:
      FLINK_JOBMANAGER_URL: http://flink-jobmanager:8081
      SECONDARY_ENGINE_METRICS_URL: http://fraud-engine-secondary:9500/metrics
      WATCHDOG_METRICS_PORT: "9600"
      WATCHDOG_INTERVAL_SEC: "15"
    ports:
      - "9601:9600"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
    restart: unless-stopped

  # =========================================================================
  # OpenSearch (Search, Analytics & Threat Hunting)
  # =========================================================================
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: bank_opensearch
    depends_on:
      connect:
        condition: service_healthy
    environment:
      - cluster.name=bank-threat-hunting
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - F:/DaTech-kafka/banking-fraud-platform/persisted-volumes/opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://localhost:9200 | grep -qE '^(200|401)$$' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s
    restart: unless-stopped

  # =========================================================================
  # OpenSearch Dashboards (The Query/Visualization Web UI)
  # =========================================================================
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: bank_opensearch_dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=admin
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================================
  # OpenSearch Sink (Kafka -> OpenSearch ingestion daemon)
  # =========================================================================
  opensearch-sink:
    build:
      context: ./analytics/opensearch
      dockerfile: Dockerfile
    container_name: bank_opensearch_sink
    depends_on:
      kafka:
        condition: service_started
      opensearch:
        condition: service_healthy
      schema-registry:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_USER: admin
      OPENSEARCH_PASSWORD: admin
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    restart: unless-stopped

  # =========================================================================
  # Prometheus Telemetry Collector
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: bank_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=2d'
      - '--storage.tsdb.retention.size=2GB'
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    depends_on:
      - api

  # =========================================================================
  # Grafana Visualization Server
  # =========================================================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: bank_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      # BUGFIX: grafana/provisioning/dashboards/dashboards.yml has always
      # pointed its file provider at /var/lib/grafana/dashboards, but nothing
      # mounted anything there -- so no dashboard JSON was ever auto-loaded.
      # This adds the actual dashboard files (cluster resource usage, fraud
      # engine redundancy) so they appear in Grafana on first boot.
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M
    depends_on:
      - prometheus

  # =========================================================================
  # cAdvisor -- per-container CPU / memory / network / disk-IO metrics
  # -------------------------------------------------------------------------
  # Gives Prometheus/Grafana visibility into resource usage for every
  # container in this stack individually (e.g. "is flink-taskmanager near
  # its memory limit", "which service is driving CPU right now"), which
  # nothing in the platform previously collected -- only application-level
  # metrics (request latency, consumer lag) were exposed, not the underlying
  # container resource consumption those applications are running on top of.
  # =========================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: bank_cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 200M
    # NOTE: cAdvisor's standard Linux recipe also mounts /dev/kmsg and runs
    # privileged; both are omitted here because this stack's own volume
    # paths (see postgres, above) indicate a Windows/Docker Desktop host,
    # where /dev/kmsg isn't available the same way. On a native Linux host,
    # re-add `devices: ["/dev/kmsg"]` and `privileged: true` for full
    # coverage (event/oom metrics); container CPU/memory/network metrics
    # work correctly without them either way.

  # =========================================================================
  # node-exporter -- host-level CPU / memory / disk / network metrics
  # -------------------------------------------------------------------------
  # Complements cAdvisor: cAdvisor answers "what is each container using",
  # node-exporter answers "what is the underlying host using in total"
  # (including resources outside any container's cgroup). Together they're
  # what "resource usage across the cluster" means in the Grafana dashboard
  # this compose file also provisions (grafana/dashboards/cluster-resource-usage.json).
  # =========================================================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: bank_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M

  # =========================================================================
  # Kafka Prometheus Exporter
  # =========================================================================
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: bank_kafka_exporter
    restart: always
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=kafka:29092'
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
    depends_on:
      - kafka