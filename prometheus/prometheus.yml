global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'banking-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['bank_api:8000']

  - job_name: 'flink-jobmanager'
    static_configs:
      - targets: ['bank_flink_jobmanager:9249']

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['bank_kafka_exporter:9308']

  # --- Fraud engine redundancy (secondary Python engine + watchdog) ---
  - job_name: 'fraud-engine-secondary'
    static_configs:
      - targets: ['bank_fraud_engine_secondary:9500']

  - job_name: 'fraud-engine-watchdog'
    static_configs:
      - targets: ['bank_fraud_engine_watchdog:9600']

  # --- Cluster-wide resource usage ---
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['bank_cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['bank_node_exporter:9100']