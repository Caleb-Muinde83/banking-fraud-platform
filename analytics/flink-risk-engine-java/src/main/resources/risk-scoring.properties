alert.threshold=80
alert.critical-threshold=100
alert.cooldown-ms=900000
state.ttl-ms=86400000
state.decay-ms=1800000

weights.NEW_DEVICE=30
weights.NEW_COUNTRY=35
weights.MULTIPLE_FAILED_LOGINS=25
weights.IMPOSSIBLE_TRAVEL=50
weights.LARGE_TRANSFER_AMOUNT=35
weights.VELOCITY_VIOLATION=30
weights.SUSPICIOUS_API_PATTERN=20
weights.HIGH_RISK_RECIPIENT=40

# Indicator derivation thresholds (NEW — these were previously undefined;
# indicator detection did not exist before this patch).
# Verify these against your actual table schemas / risk policy before trusting them.
indicator.large-transfer-threshold=10000
indicator.velocity-window-ms=300000
indicator.velocity-count-threshold=4
indicator.failed-login-window-ms=300000
indicator.failed-login-threshold=3
indicator.impossible-travel-window-ms=7200000
indicator.api-rate-window-ms=60000
indicator.api-rate-threshold=50
# Comma-separated list of high-risk RECIPIENT ACCOUNT NUMBERS (matched
# against transactions.to_account — Transaction has no beneficiary_id
# column, so this is keyed on the account number, not a beneficiary ID).
indicator.high-risk-recipients=

# Schema Registry (NEW — Avro was previously serialized with a local,
# unregistered schema; this wires it into the real registry).
schema-registry.url=http://schema-registry:8081
# CHANGED: was schema-registry.subject (single) — split now that alerts
# route to two real topics instead of one topic with a severity field.
schema-registry.fraud-subject=fraud_alerts_v2-value
schema-registry.critical-subject=critical_alerts_v2-value