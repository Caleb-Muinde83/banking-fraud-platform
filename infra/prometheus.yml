global:
  scrape_interval: 15s
  evaluation_interval: 15s

# NOTE: this is a SEPARATE file from prometheus/prometheus.yml (the
# single-host version) -- it can't be the same file, because the two
# deployments need genuinely different target addressing for cadvisor and
# node-exporter (see the long comment on the cadvisor service in
# infra/docker-compose.yml for why). Everything else is identical in
# substance to the single-host version, just addressed by Swarm service
# name instead of container_name.

scrape_configs:
  - job_name: 'banking-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']

  - job_name: 'flink-jobmanager'
    static_configs:
      - targets: ['flink-jobmanager:9249']

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'fraud-engine-secondary'
    static_configs:
      - targets: ['fraud-engine-secondary:9500']

  - job_name: 'fraud-engine-watchdog'
    static_configs:
      - targets: ['fraud-engine-watchdog:9600']

  # --- Cluster-wide resource usage ---
  # cadvisor/node-exporter run in `deploy.mode: global` with `mode: host`
  # port publishing (one task per node, bound to each node's own host
  # port) -- NOT reachable as a single "cadvisor:8085" service name the
  # way every other job above is, since Swarm's routing mesh would just
  # load-balance that name across all three nodes' tasks round-robin,
  # silently giving you one-of-three rather than all-three. Targeting
  # each node's real host IP directly is what actually reaches all three.
  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - '100.68.40.33:8085'
          - '100.120.104.76:8085'
          - '100.109.78.25:8085'

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - '100.68.40.33:9100'
          - '100.120.104.76:9100'
          - '100.109.78.25:9100'
