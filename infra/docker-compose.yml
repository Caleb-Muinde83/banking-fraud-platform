version: "3.8"

# =============================================================================
# UPDATED TO MATCH docker-compose.yml (single-host dev stack) — see the
# bottom of this file for a full changelog of what was added, and three
# Swarm-specific corrections that are NOT just mechanical ports:
#
#   1. Every bind-mounted config file in the single-host version (prometheus.yml,
#      grafana's provisioning YAMLs, the two Grafana dashboard JSONs, the
#      Debezium connector JSON) is converted to a Swarm `configs:` object
#      instead of a bind mount. A relative bind mount (`./prometheus.yml:...`)
#      only works if that exact host path exists on whichever node Swarm
#      happens to schedule the container onto -- which you can't guarantee
#      across k3s-master / k3s-worker-2 / k3s-worker-3. This is the exact
#      same reason postgres's own init script is already baked into the
#      custom image rather than bind-mounted (see the original comment on
#      the postgres service, preserved below) -- this update just applies
#      that same already-established principle consistently to every new
#      service, rather than reintroducing the bug five more times.
#
#   2. cadvisor and node-exporter use `deploy.mode: global` (one task per
#      node, automatically) instead of being pinned to a single node like
#      every other service here. Pinning them to one node -- the naive
#      "just copy the single-host version" move -- would give you resource
#      metrics for exactly one of your three nodes and nothing for the
#      other two, which defeats the entire point of "resource usage across
#      the cluster." They also publish their ports in `mode: host` rather
#      than the default routing-mesh mode -- see the long comment on
#      cadvisor below for why, and the required prometheus.yml change this
#      implies.
#
#   3. depends_on is deliberately NOT used anywhere in this file, including
#      for the newly-added services. `docker stack deploy` does not support
#      depends_on conditions (service_healthy / service_completed_successfully)
#      at all -- that's a docker-compose-CLI-only feature -- and Swarm mode
#      has no native concept of startup ordering between services. This
#      matches the original file's own behavior (it already had zero
#      depends_on blocks); robustness instead comes entirely from each
#      service's own retry logic (kafka-init's and connect-init's polling
#      loops, Kafka client libraries' own reconnect behavior, etc.).
# =============================================================================

networks:
  fraud_network:
    driver: overlay
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: "1200"

# =============================================================================
# Swarm configs -- replaces every bind-mounted config file from the
# single-host docker-compose.yml. `file:` sources are read from disk at
# `docker stack deploy` time and distributed to whichever node(s) actually
# need them; unlike a bind mount, this works regardless of node placement.
# =============================================================================
configs:
  debezium_connector_config:
    file: ../debezium-postgres-connector.json
  prometheus_config:
    file: ./prometheus.yml
  grafana_datasource_config:
    file: ../grafana/provisioning/datasources/ds-prometheus.yml
  grafana_dashboard_provider_config:
    file: ../grafana/provisioning/dashboards/dashboards.yml
  grafana_dashboard_cluster_resources:
    file: ../grafana/dashboards/cluster-resource-usage.json
  grafana_dashboard_fraud_redundancy:
    file: ../grafana/dashboards/fraud-engine-redundancy.json

# =============================================================================
# Swarm secrets. Created OUT OF BAND before `docker stack deploy` runs, e.g.:
#   printf 'SecureBankPassword2026!' | docker secret create postgres_password -
#   printf 'secret-demo-key-99'       | docker secret create demo_admin_key -
#   printf '<a-real-grafana-password>' | docker secret create grafana_admin_password -
# `external: true` means this file only REFERENCES each secret by name; it
# never contains the credential itself.
#
# UPDATED (this pass): demo_admin_key and grafana_admin_password added,
# closing two of the three items the previous changelog flagged as "still
# plaintext, known follow-up." api/app/core/database.py and
# api/app/api/demo.py were both updated to support a *_FILE convention
# (matching postgres-init.sh's existing POSTGRES_PASSWORD_FILE pattern) so
# these secrets are actually read at runtime, not just declared here for
# show -- see the `api` and `grafana` service definitions below for the
# corresponding env var / secrets wiring, and the bottom changelog for the
# one credential (OpenSearch admin/admin) that is DELIBERATELY NOT touched
# in this pass, with the reason explained there.
# =============================================================================
secrets:
  postgres_password:
    external: true
  demo_admin_key:
    external: true
  grafana_admin_password:
    external: true

services:
  # =========================================================================
  # NODE 1: k3s-master (100.68.40.33)
  # =========================================================================

  postgres:
    image: banking-postgres:latest
    entrypoint:
      - /bin/bash
      - /docker-entrypoint-initdb.d/postgres-init.sh
    command:
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: postgres_admin
      # Password now comes from the Swarm secret below via
      # POSTGRES_PASSWORD_FILE -- postgres-init.sh has been updated to
      # check for this first, matching the official Postgres image's own
      # convention, and only fall back to POSTGRES_PASSWORD (unset here)
      # if no _FILE variant is present.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init script is baked into the image to avoid fragile host-bind mounts in Swarm
    networks:
      - fraud_network
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-master
      restart_policy:
        condition: on-failure

  api:
    image: banking-api:latest
    environment:
      # CREDENTIAL FIX (this pass): DATABASE_URL is no longer set directly.
      # api/app/core/database.py only builds DATABASE_URL from these
      # individual POSTGRES_* pieces when DATABASE_URL itself is absent --
      # confirmed by reading that file directly, not assumed -- and it now
      # checks POSTGRES_PASSWORD_FILE first (this pass's change), so the
      # postgres_password secret already used by the postgres service below
      # is reused here rather than needing a second copy of the same secret.
      POSTGRES_USER: postgres_admin
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: banking_db
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      ENABLE_DEMO_RESET: "true"
      # CREDENTIAL FIX (this pass): api/app/api/demo.py now checks
      # DEMO_ADMIN_KEY_FILE first, same convention as above.
      DEMO_ADMIN_KEY_FILE: /run/secrets/demo_admin_key
    secrets:
      - postgres_password
      - demo_admin_key
    ports:
      - "8000:8000"
    networks:
      - fraud_network
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-master
      restart_policy:
        condition: on-failure

  simulator:
    image: banking-simulator:latest
    environment:
      API_URL: http://api:8000
      BANKING_API_URL: http://api:8000
    networks:
      - fraud_network
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-master
      restart_policy:
        condition: on-failure

  kafka-connect:
    image: debezium/connect:2.4
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: banking-connect-group
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"
    networks:
      - fraud_network
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-master
      restart_policy:
        condition: on-failure

  # =========================================================================
  # ADDED -- was entirely missing from this file. Without it, the Debezium
  # connector is never actually registered against kafka-connect's REST API,
  # meaning CDC silently never starts even though kafka-connect itself is
  # "running". Uses the Swarm config above instead of the single-host
  # version's bind mount, for the reason explained at the top of this file.
  # =========================================================================
  connect-init:
    image: curlimages/curl:latest
    networks:
      - fraud_network
    configs:
      - source: debezium_connector_config
        target: /tmp/debezium-postgres-connector.json
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo 'Waiting for Kafka Connect availability...'
        until curl -fs http://kafka-connect:8083/connectors >/dev/null 2>&1; do
          sleep 5
        done

        echo 'Registering Debezium connector if missing...'
        if curl -s -o /dev/null -w '%{http_code}' http://kafka-connect:8083/connectors/banking-cdc-connector | grep -q '^200$$'; then
          echo 'Connector already registered.'
          exit 0
        fi

        curl -s -X POST \
          -H 'Content-Type: application/json' \
          --data @/tmp/debezium-postgres-connector.json \
          http://kafka-connect:8083/connectors

        echo 'Connector registration complete.'
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-master
      restart_policy:
        condition: none

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    networks:
      - fraud_network
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo 'Waiting for Kafka broker availability...'
        until kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
          sleep 5
        done

        echo 'Provisioning Platform Topics...'
        topics="api_requests dead_letter_queue fraud_alerts critical_alerts risk_scores risk_scores_v2 fraud_alerts_v2 critical_alerts_v2 enriched_transactions model_features banking.login_events banking.sessions banking.accounts banking.transactions banking.beneficiaries banking.employee_actions banking.unified_timeline"

        for topic in $$topics; do
          kafka-topics \
            --bootstrap-server kafka:9092 \
            --create \
            --if-not-exists \
            --topic $$topic \
            --partitions 3 \
            --replication-factor 1
        done

        echo 'Verifying topics...'
        kafka-topics --bootstrap-server kafka:9092 --list
        echo 'Bootstrap complete.'
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-master
      restart_policy:
        condition: none

  # =========================================================================
  # NODE 2: k3s-worker-2 (100.120.104.76)
  # =========================================================================

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://100.120.104.76:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "19092:19092"
    volumes:
      - kafkadata_kraft:/var/lib/kafka/data
    networks:
      - fraud_network
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-worker-2
      restart_policy:
        condition: on-failure

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    networks:
      - fraud_network
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-worker-2
      restart_policy:
        condition: on-failure

  # =========================================================================
  # ADDED -- was entirely missing. Mirrors the single-host file's
  # kafka-exporter service exactly; no Swarm-specific changes needed here,
  # it's a pure metrics endpoint with no bind mounts or per-node concerns.
  # =========================================================================
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    command:
      - '--kafka.server=kafka:9092'
    ports:
      - "9308:9308"
    networks:
      - fraud_network
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-worker-2
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
      restart_policy:
        condition: on-failure

  # =========================================================================
  # NODE 3: k3s-worker-3 (100.109.78.25)
  # =========================================================================

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - cluster.name=bank-threat-hunting
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      # CREDENTIAL FIX PASS -- DELIBERATELY NOT CHANGED: OPENSEARCH_USER/
      # OPENSEARCH_PASSWORD on opensearch-sink and flink-risk-engine below
      # are still "admin"/"admin". Checked why before deciding whether to
      # rotate them: DISABLE_SECURITY_PLUGIN=true on THIS service (and on
      # opensearch-dashboards) means OpenSearch's security plugin -- the
      # thing that would actually validate those credentials -- is turned
      # off entirely. Anyone who can reach port 9200 on this node already
      # has full, unauthenticated read/write access to every index
      # regardless of what OPENSEARCH_USER/PASSWORD are set to downstream.
      # Rotating "admin"/"admin" to something else would change nothing
      # real and risk creating false confidence that this is secured. The
      # actual fix is enabling the security plugin (TLS certs, a real
      # admin credential OpenSearch itself checks, role mapping) -- a
      # meaningfully bigger, separate task, correctly left as a genuine
      # follow-up rather than faked here with a credential rotation that
      # wouldn't do anything.
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    networks:
      - fraud_network
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-worker-3
      restart_policy:
        condition: on-failure

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_PLUGIN=true
    networks:
      - fraud_network
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-worker-3
      restart_policy:
        condition: on-failure

  # =========================================================================
  # ADDED -- was entirely missing. Without this, CDC events and telemetry
  # keep flowing through Kafka correctly, but nothing ever lands in
  # OpenSearch for threat-hunting -- the "alerts"/"login_events"/etc.
  # indices would just stay permanently empty on a Swarm deployment.
  # =========================================================================
  opensearch-sink:
    image: banking-opensearch-sink:latest
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_USER: admin
      OPENSEARCH_PASSWORD: admin
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks:
      - fraud_network
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-worker-3
      restart_policy:
        condition: on-failure

  flink-jobmanager:
    image: flink:1.18-scala_2.12
    ports:
      - "8082:8081"
      - "9249:9249"
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      # ADDED -- the single-host version sets these directly via
      # FLINK_PROPERTIES for the Prometheus reporter; ported here the same
      # way rather than dropped, since without it flink-jobmanager exposes
      # no :9249 metrics for Prometheus to scrape at all.
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    networks:
      - fraud_network
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-worker-3
      restart_policy:
        condition: on-failure

  flink-taskmanager:
    image: flink:1.18-scala_2.12
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    networks:
      - fraud_network
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-worker-3
      restart_policy:
        condition: on-failure

  flink-risk-engine:
    image: banking-flink-risk-engine:latest
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FLINK_RISK_GROUP_ID: fraud-engine-v2
      KAFKA_FRAUD_ALERT_TOPIC: fraud_alerts_v2
      KAFKA_CRITICAL_ALERT_TOPIC: critical_alerts_v2
      FLINK_JOBMANAGER_HOST: flink-jobmanager
      FLINK_JOBMANAGER_PORT: "8081"
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_USER: admin
      OPENSEARCH_PASSWORD: admin
    networks:
      - fraud_network
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-worker-3
      restart_policy:
        condition: on-failure

  # =========================================================================
  # ADDED -- the whole point of this update. Active-active secondary risk
  # engine, same as fraud-engine-secondary in the single-host file. Placed
  # on k3s-worker-3 alongside the other scoring/analytics workloads.
  # =========================================================================
  fraud-engine-secondary:
    image: banking-fraud-engine-secondary:latest
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SECONDARY_ENGINE_GROUP_ID: fraud-engine-secondary-v1
      SECONDARY_ENGINE_METRICS_PORT: "9500"
      SECONDARY_FRAUD_TOPIC: fraud_alerts
      SECONDARY_CRITICAL_TOPIC: critical_alerts
      API_REQUEST_SCHEMA_PATH: /app/config/schemas/api_request.avsc
    ports:
      - "9500:9500"
    networks:
      - fraud_network
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-worker-3
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
      restart_policy:
        condition: on-failure

  # =========================================================================
  # ADDED -- redundancy/liveness watchdog for the two engines above.
  # =========================================================================
  fraud-engine-watchdog:
    image: banking-fraud-engine-watchdog:latest
    environment:
      FLINK_JOBMANAGER_URL: http://flink-jobmanager:8081
      SECONDARY_ENGINE_METRICS_URL: http://fraud-engine-secondary:9500/metrics
      WATCHDOG_METRICS_PORT: "9600"
      WATCHDOG_INTERVAL_SEC: "15"
    ports:
      # Host port 9601 here too, same reason as the single-host file: 9600
      # is already OpenSearch's own performance-analyzer port, and both
      # services can land on overlapping ports via the routing mesh.
      - "9601:9600"
    networks:
      - fraud_network
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-worker-3
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
      restart_policy:
        condition: on-failure

  # =========================================================================
  # ADDED -- was entirely missing. Configs replace the single-host
  # bind mounts, per the note at the top of this file.
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=2d'
      - '--storage.tsdb.retention.size=2GB'
    ports:
      - "9090:9090"
    networks:
      - fraud_network
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-master
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:10.2.0
    environment:
      # CREDENTIAL FIX (this pass): grafana/grafana's own image natively
      # supports a "__FILE" (double underscore) suffix convention for
      # reading select env vars from a mounted file instead of plaintext --
      # this is Grafana's own documented mechanism, not something bolted on
      # here, so no code change was needed for this one (unlike api's two
      # fixes above). GF_SECURITY_ADMIN_PASSWORD is set once, out of band,
      # via `docker secret create grafana_admin_password -` before this
      # secret's first deploy -- change it from "admin" at that point.
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
    secrets:
      - grafana_admin_password
    configs:
      - source: grafana_datasource_config
        target: /etc/grafana/provisioning/datasources/ds-prometheus.yml
      - source: grafana_dashboard_provider_config
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: grafana_dashboard_cluster_resources
        target: /var/lib/grafana/dashboards/cluster-resource-usage.json
      - source: grafana_dashboard_fraud_redundancy
        target: /var/lib/grafana/dashboards/fraud-engine-redundancy.json
    ports:
      - "3000:3000"
    networks:
      - fraud_network
    deploy:
      placement:
        constraints:
          - node.hostname == k3s-master
      resources:
        limits:
          cpus: '0.20'
          memory: 256M
      restart_policy:
        condition: on-failure

  # =========================================================================
  # ADDED -- deploy.mode: global, NOT pinned to one node. See the long
  # comment at the top of this file for why. `mode: host` on the port
  # publishing is the other Swarm-specific correction: it binds directly to
  # each node's own host port instead of going through Swarm's routing
  # mesh. This matters here specifically because the routing mesh would
  # otherwise load-balance any request to "cadvisor:8085" across all three
  # nodes' cadvisor tasks round-robin -- which is exactly wrong for a
  # per-node metrics scrape, where Prometheus needs to reach EACH node's
  # cadvisor individually, not a random one of the three.
  #
  # CONSEQUENCE FOR prometheus.yml: static_configs targeting a single
  # "cadvisor:8080" hostname (as the single-host prometheus.yml does) will
  # NOT correctly scrape all three nodes under this pattern. It needs to
  # target each node's real host IP directly instead:
  #   - job_name: 'cadvisor'
  #     static_configs:
  #       - targets: ['100.68.40.33:8085', '100.120.104.76:8085', '100.109.78.25:8085']
  #   - job_name: 'node-exporter'
  #     static_configs:
  #       - targets: ['100.68.40.33:9100', '100.120.104.76:9100', '100.109.78.25:9100']
  # A more production-grade approach would use Prometheus's docker_sd_configs
  # for dynamic Swarm task discovery instead of hardcoded IPs, but given
  # this file already hardcodes all three node identities and IPs
  # throughout (see KAFKA_ADVERTISED_LISTENERS above, and the node
  # placement constraints everywhere), static IP targets are consistent
  # with the rest of this file's existing style rather than a bigger
  # architectural jump.
  # =========================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - fraud_network
    ports:
      - target: 8080
        published: 8085
        mode: host
    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.20'
          memory: 200M
      restart_policy:
        condition: on-failure
    # UPDATED (this pass): the single-host docker-compose.yml deliberately
    # omits privileged/kmsg/an explicit docker.sock mount, because we
    # confirmed directly (curl-ing cAdvisor's own /metrics and grepping for
    # container_cpu_usage_seconds_total{name=~"bank_.+"}) that even with all
    # three of those, cAdvisor still couldn't resolve container names under
    # Docker Desktop's WSL2 backend -- every real container's metrics carried
    # only a raw cgroup `id`, never a `name` or `container_label_*`. That's a
    # confirmed platform limitation of WSL2 specifically, not of this
    # combination of flags in general. k3s-master/k3s-worker-2/k3s-worker-3
    # are real Linux hosts, where this exact combination (privileged +
    # /dev/kmsg + an explicit docker.sock mount, matching the standard
    # upstream cAdvisor recipe) is expected to work correctly and should be
    # verified with the same curl check once this is actually deployed --
    # if it does, the per-container Grafana panels that were removed from
    # cluster-resource-usage.json for the WSL2 deployment (see that file's
    # own explanatory text panel) are worth re-adding for this one.

  node-exporter:
    image: prom/node-exporter:v1.7.0
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - fraud_network
    ports:
      - target: 9100
        published: 9100
        mode: host
    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
      restart_policy:
        condition: on-failure

volumes:
  pgdata:
  kafkadata_kraft:
  osdata:

