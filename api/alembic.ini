[alembic]
# Path to migration environment directory
script_location = alembic

# Connection string for running migrations locally against PostgreSQL container on port 5433
sqlalchemy.url = postgresql+psycopg2://postgres_admin:SecureBankPassword2026!@localhost:5433/banking_db

# Logging Configuration
[loggers]
keys = root,alembic,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S